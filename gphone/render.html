<!doctype html>
<html><head><meta charset="utf-8">
<style>
  body{margin:0;background:#0f1115;font-family:Inter,Helvetica,Arial,sans-serif;color:#e6e8ee}
  .wrap{width:1600px;height:1000px;padding:40px;box-sizing:border-box}
  h1{margin:0 0 4px;font-size:38px;letter-spacing:1px}
  h1 span{color:#5ad1a0}
  .sub{color:#8a90a0;font-size:17px;margin-bottom:20px}
  text{font-family:Inter,Helvetica,Arial,sans-serif}
</style></head>
<body><div class="wrap">
<h1>G-Phone <span>v1</span> — conceito</h1>
<div class="sub">Privacidade e segurança · só Wi-Fi · sem SIM · sem câmera · sem GPS · Mobian modificado · 72 × 140 × 18 mm (estimado)</div>

<svg width="1520" height="850" viewBox="0 0 1520 850">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b2f38"/><stop offset="1" stop-color="#16181d"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d2a24"/><stop offset="1" stop-color="#061210"/>
    </linearGradient>
    <linearGradient id="pcb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f5d3c"/><stop offset="1" stop-color="#123a26"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity=".6"/>
    </filter>
  </defs>

  <!-- ============ FRONT ============ -->
  <text x="190" y="20" text-anchor="middle" font-size="20" fill="#8a90a0">FRENTE</text>
  <g transform="translate(46,40)" filter="url(#sh)">
    <rect width="288" height="560" rx="34" fill="url(#body)" stroke="#3a3f4b" stroke-width="2"/>
    <rect x="14" y="40" width="260" height="462" rx="10" fill="url(#screen)" stroke="#000" stroke-width="2"/>
    <!-- earpiece grille -->
    <rect x="114" y="18" width="60" height="6" rx="3" fill="#0b0c0f"/>
    <!-- status bar -->
    <text x="28" y="64" font-size="13" fill="#7fe3bf">12:00</text>
    <text x="260" y="64" font-size="12" fill="#7fe3bf" text-anchor="end">Wi-Fi · 🔒 LUKS</text>
    <!-- lock screen -->
    <circle cx="144" cy="190" r="44" fill="none" stroke="#5ad1a0" stroke-width="3"/>
    <rect x="124" y="186" width="40" height="30" rx="5" fill="#5ad1a0"/>
    <path d="M131 186 v-10 a13 13 0 0 1 26 0 v10" fill="none" stroke="#5ad1a0" stroke-width="4"/>
    <text x="144" y="268" font-size="26" fill="#e6e8ee" text-anchor="middle" font-weight="700">G-Phone</text>
    <text x="144" y="292" font-size="13" fill="#7f8a92" text-anchor="middle">Digite a senha para descriptografar</text>
    <rect x="44" y="314" width="200" height="38" rx="8" fill="#0b1a17" stroke="#2f6f5a"/>
    <text x="60" y="339" font-size="18" fill="#5ad1a0">● ● ● ● ● ●</text>
    <!-- apps row -->
    <g font-size="11" fill="#9aa3ad" text-anchor="middle">
      <rect x="40" y="400" width="48" height="48" rx="12" fill="#2a64d8"/><text x="64" y="464">Signal</text>
      <rect x="120" y="400" width="48" height="48" rx="12" fill="#c9c9d6"/><text x="144" y="464">SimpleX</text>
      <rect x="200" y="400" width="48" height="48" rx="12" fill="#0dbd8b"/><text x="224" y="464">Element</text>
    </g>
    <!-- speaker -->
    <g fill="#0b0c0f">
      <circle cx="120" cy="530" r="3"/><circle cx="132" cy="530" r="3"/><circle cx="144" cy="530" r="3"/><circle cx="156" cy="530" r="3"/><circle cx="168" cy="530" r="3"/>
    </g>
  </g>
  <!-- front labels -->
  <g font-size="14" fill="#c9ced8">
    <line x1="334" y1="300" x2="372" y2="300" stroke="#5ad1a0"/>
    <text x="378" y="296">Tela 5" DSI</text><text x="378" y="314" fill="#8a90a0">touch capacitivo</text>
    <line x1="230" y1="570" x2="372" y2="640" stroke="#5ad1a0"/>
    <text x="378" y="636">Alto-falante</text><text x="378" y="654" fill="#8a90a0">MAX98357A (I2S)</text>
    <text x="46" y="640" fill="#8a90a0">Sem câmera frontal</text>
  </g>

  <!-- ============ SIDE ============ -->
  <text x="620" y="20" text-anchor="middle" font-size="20" fill="#8a90a0">LATERAL</text>
  <g transform="translate(584,40)" filter="url(#sh)">
    <rect width="72" height="560" rx="22" fill="url(#body)" stroke="#3a3f4b" stroke-width="2"/>
    <!-- mic kill switch -->
    <rect x="22" y="90" width="28" height="64" rx="6" fill="#0b0c0f"/>
    <rect x="25" y="94" width="22" height="28" rx="4" fill="#e0524b"/>
    <!-- wifi/bt kill switch -->
    <rect x="22" y="190" width="28" height="64" rx="6" fill="#0b0c0f"/>
    <rect x="25" y="222" width="22" height="28" rx="4" fill="#5ad1a0"/>
    <!-- power -->
    <rect x="26" y="300" width="20" height="50" rx="8" fill="#555c6a"/>
    <!-- panic -->
    <rect x="26" y="390" width="20" height="40" rx="8" fill="#ffb02e"/>
    <rect x="20" y="384" width="32" height="52" rx="10" fill="none" stroke="#ffb02e" stroke-dasharray="3 3"/>
    <!-- usb-c -->
    <rect x="22" y="532" width="28" height="10" rx="5" fill="#0b0c0f"/>
  </g>
  <g font-size="14" fill="#c9ced8">
    <line x1="656" y1="162" x2="700" y2="162" stroke="#e0524b"/>
    <text x="706" y="158">Kill switch microfone</text><text x="706" y="176" fill="#8a90a0">corta a energia do mic</text>
    <line x1="656" y1="262" x2="700" y2="262" stroke="#5ad1a0"/>
    <text x="706" y="258">Kill switch Wi-Fi/BT</text><text x="706" y="276" fill="#8a90a0">WL_nDisable · BT_nDisable</text>
    <line x1="656" y1="365" x2="700" y2="365" stroke="#555c6a"/>
    <text x="706" y="370">Liga/desliga</text>
    <line x1="656" y1="450" x2="700" y2="450" stroke="#ffb02e"/>
    <text x="706" y="446">Botão de pânico</text><text x="706" y="464" fill="#8a90a0">toque longo 5 s · apaga LUKS</text>
    <line x1="656" y1="577" x2="700" y2="577" stroke="#8a90a0"/>
    <text x="706" y="582">USB-C (carga)</text>
  </g>

  <!-- ============ INSIDE ============ -->
  <text x="1210" y="20" text-anchor="middle" font-size="20" fill="#8a90a0">POR DENTRO (sem tampa traseira)</text>
  <g transform="translate(1066,40)" filter="url(#sh)">
    <rect width="288" height="560" rx="34" fill="#1a1c22" stroke="#3a3f4b" stroke-width="2"/>
    <!-- carrier PCB -->
    <rect x="16" y="20" width="256" height="250" rx="10" fill="url(#pcb)" stroke="#2f8a5c"/>
    <!-- CM5 -->
    <rect x="34" y="38" width="160" height="116" rx="4" fill="#0f6b45" stroke="#5ad1a0"/>
    <rect x="54" y="62" width="52" height="52" rx="3" fill="#2a2d33"/><text x="80" y="92" font-size="9" fill="#bbb" text-anchor="middle">BCM2712</text>
    <rect x="116" y="62" width="34" height="24" rx="2" fill="#2a2d33"/><text x="133" y="78" font-size="8" fill="#bbb" text-anchor="middle">RAM</text>
    <rect x="116" y="92" width="34" height="22" rx="2" fill="#2a2d33"/><text x="133" y="106" font-size="8" fill="#bbb" text-anchor="middle">eMMC</text>
    <rect x="158" y="62" width="26" height="20" rx="2" fill="#c0c4cc"/><text x="171" y="96" font-size="8" fill="#ddd" text-anchor="middle">Wi-Fi</text>
    <text x="114" y="144" font-size="12" fill="#e6e8ee" text-anchor="middle" font-weight="700">Raspberry Pi CM5</text>
    <!-- power section -->
    <rect x="208" y="38" width="50" height="34" rx="3" fill="#222" /><text x="233" y="59" font-size="9" fill="#ccc" text-anchor="middle">BQ24074</text>
    <rect x="208" y="80" width="50" height="34" rx="3" fill="#222" /><text x="233" y="101" font-size="9" fill="#ccc" text-anchor="middle">TPS61088</text>
    <!-- audio -->
    <rect x="34" y="176" width="54" height="30" rx="3" fill="#222"/><text x="61" y="195" font-size="9" fill="#ccc" text-anchor="middle">MAX98357A</text>
    <rect x="100" y="176" width="40" height="30" rx="3" fill="#222"/><text x="120" y="195" font-size="9" fill="#ccc" text-anchor="middle">INMP441</text>
    <!-- DSI -->
    <rect x="152" y="180" width="70" height="20" rx="2" fill="#d9a441"/><text x="187" y="194" font-size="9" fill="#222" text-anchor="middle">DSI tela</text>
    <!-- secure? debug -->
    <rect x="34" y="222" width="110" height="30" rx="3" fill="#163d2a" stroke="#2f8a5c" stroke-dasharray="3 3"/><text x="89" y="241" font-size="9" fill="#9fd" text-anchor="middle">GPIO chaves + pânico</text>
    <rect x="236" y="236" width="28" height="12" rx="5" fill="#888"/><text x="210" y="246" font-size="9" fill="#ccc" text-anchor="end">USB-C</text>
    <!-- battery -->
    <rect x="24" y="290" width="240" height="210" rx="12" fill="#2d3340" stroke="#4a5263"/>
    <text x="144" y="390" font-size="22" fill="#e6e8ee" text-anchor="middle" font-weight="700">Bateria Li-ion</text>
    <text x="144" y="414" font-size="15" fill="#9aa3ad" text-anchor="middle">4000 mAh · 3,7 V</text>
    <text x="144" y="436" font-size="12" fill="#7f8a92" text-anchor="middle">≈ 4–6 h de uso</text>
    <!-- speaker -->
    <rect x="94" y="514" width="100" height="30" rx="8" fill="#0b0c0f" stroke="#444"/><text x="144" y="534" font-size="10" fill="#aaa" text-anchor="middle">alto-falante</text>
  </g>
  <g font-size="14" fill="#c9ced8">
    <text x="1066" y="640">Placa própria: PCB 4 camadas, fabricada e</text>
    <text x="1066" y="658">montada pela PCBWay · carcaça impressa em 3D</text>
  </g>

  <!-- ============ SPEC STRIP ============ -->
  <g transform="translate(0,700)">
    <rect width="1520" height="130" rx="14" fill="#161920" stroke="#262a33"/>
    <g font-size="15" fill="#e6e8ee">
      <text x="30" y="40" fill="#5ad1a0" font-weight="700">REDE</text>
      <text x="30" y="64">Só Wi-Fi + Bluetooth</text><text x="30" y="86" fill="#8a90a0">sem modem · sem SIM</text>

      <text x="290" y="40" fill="#5ad1a0" font-weight="700">SEGURANÇA</text>
      <text x="290" y="64">LUKS · boot verificado</text><text x="290" y="86" fill="#8a90a0">botão de pânico</text>

      <text x="550" y="40" fill="#5ad1a0" font-weight="700">REMOVIDO</text>
      <text x="550" y="64">Sem câmera · sem GPS</text><text x="550" y="86" fill="#8a90a0">menos sensores, menos rastreio</text>

      <text x="830" y="40" fill="#5ad1a0" font-weight="700">SISTEMA</text>
      <text x="830" y="64">Mobian modificado</text><text x="830" y="86" fill="#8a90a0">Signal · SimpleX · Element</text>

      <text x="1100" y="40" fill="#5ad1a0" font-weight="700">ORÇAMENTO</text>
      <text x="1100" y="64">≈ R$ 1.300–1.800</text><text x="1100" y="86" fill="#8a90a0">protótipo · sem impostos</text>
    </g>
    <text x="1490" y="118" font-size="12" fill="#5a6070" text-anchor="end">Ilustração conceitual — medidas e posições aproximadas</text>
  </g>
</svg>
</div></body></html>
